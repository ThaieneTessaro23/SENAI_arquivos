<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<title> Links </title>
		<meta charset="UTF-8">
		<style>
			a {
				color: #1a73e8;
				text-decoration: none;
				border-bottom: 2px dotted;
			}
			a:hover {
				color: #0c47a1;
			}
			a:active {
				color: #ff0000;
			}
			a:focus {
				outline: 2px solid red;
				border: 2px dashed #0c47a1;
				background-color: #e0e0e0;
			}
		</style>
	</head>
	<body style='background-color: #D7E5F7'>
		<header>
			<h1 style='text-align:center; color: #072347'> Links </h1>
		</header>
		<nav>
			<a href="https://www.facebook.com" target="_blank">Facebook</a><br>
			<a href="https://www.instagram.com" target="_blank">Instagram</a><br>
			<a href="https://www.twitter.com" target="_blank">X</a><br>
			<a href="https://www.linkedin.com" target="_blank">LinkedIn</a><br>
			<a href="https://www.tiktok.com" target="_blank">TikTok</a><br>
		</nav>
	</body>
</html>
