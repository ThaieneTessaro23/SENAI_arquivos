<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<title> Tabelas </title>
		<meta charset="UTF-8">
		<style>
			th {
				background-color: #f0f0f0;
				color: #333333;
				text-align:center;
			}
			table {
				border: 1px solid #dddddd;
				border-spacing: 0px;
				padding: 10px;
				text-align: left;
			}
			table tr:nth-child(even) {		/*Linhas pares pintadas*/
				background-color: #f9f9f9;
			}
		</style>
	</head>
	<body style='background-color: #D7E5F7'>
		<header>
			<h1 style='text-align:center; color: #072347'> Animais </h1>
		</header>
		<main>
			<article>
				<table border="1" style="width:100%">
					<tr>
						<th> Animais </th>
						<th> Habitat </th>
						<th> Dieta </th>
					</tr>
					<tr>
						<td>Coelho</td>
						<td>Campos e florestas</td>
						<td>Vegetais</td>
					</tr>
					<tr>
						<td>Lobo</td>
						<td>Florestas e montanhas</td>
						<td>Carne</td>
					</tr>
					<tr>
						<td>Águia</td>
						<td>Montanhas e rios</td>
						<td>Peixes e pequenos animais</td>
					</tr>
					<tr>
						<td>Elefante</td>
						<td>Savanas e florestas</td>
						<td>Plantas e frutas</td>
					</tr>
				</table>
			</article>
		</main>
	</body>
</html>
