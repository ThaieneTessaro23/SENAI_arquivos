<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<title>CSS Interno</title>
		<meta charset="UTF-8">
		<style> 
			p{
				color: purple;
				font-family: Arial;
				font-size: 72px;
			}
			#p2{
				color: pink;
				font-family: Times New Roman;
				font-size: 50px;
			}
			.p_estiloso{
				color: red;
				font-family: Calibri;
				font-size: 150px;
			}
		</style>
	</head>
	<body>
		<p>Este é um texto simples!</p>
		<p id="p2">Este é o segundo parágrafo</p>
		<h1>Este é um título <h1>
		<p class="p_estiloso">Este é o terceiro parágrafo</p>
	</body>
</html>
