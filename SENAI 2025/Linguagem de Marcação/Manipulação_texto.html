<!DOCTYPE html>
<html lang ="pt-br">
	<head>
		<title>Estilização de Texto</title>
		<meta charset="UTF-8">
		<link rel="icon" type="image/x-icon" href="https://i.pinimg.com/originals/e7/a0/9b/e7a09b64ac45c1f813b231cfff5715fa.png">
	</head>
	<body>
		<h1 style="text-align:center;">Título 1</h1>
		<hr>
		<h2>Título 2</h2>
		<h3>Título 3</h3>
		<h4>Título 4</h4>
		<h5>Título 5</h5>
		<h6>título 6</h6>
		<p>Este é um texto normal</p>
		<b>Este é um parágrafo em negrito</b>
		<!-- Este é um comentário -->
		<br><br><br><br><br><br><br><br><br><br>
		<em>Este é um texto em itálico</em>
		<br><br>
		<p>O elemento da água é: H<sub>2</sub>O</p>
		<p>Equação de Einstein: E = mc<sup>2</sup></p>
		<img src="https://th.bing.com/th/id/OIP.okHtjTubRnzt9CX0ol6zXQHaHp?w=171&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" width="50%">
		<h3>Texto à esquerda</h3>
		<p style="text-align:left;">p esquerda</p>
		<h3>Texto à direita</h3>
		<p style="text-align:right;">p direita</p>
		<h3>Texto no centro</h3>
		<p style="text-align:center;">p centro</p>
		
		<!-- Figura com legenda: -->
		<figure>
			<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRSpfkyRTgIa8eFnDmtfoo-6MYJuQ2cGMaQ9g&s" width="40%">
			<figcaption>Fig. 1 - Gretchen</figcaption>
		</figure>
	</body>
</html>
