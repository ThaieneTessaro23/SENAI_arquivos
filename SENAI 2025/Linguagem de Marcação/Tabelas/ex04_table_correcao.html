<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF- 8">
		<title>Tabela Hard</title>
	</head>
	<body>
		<table border="1" style="width:100%">
			<tr>
				<td style="background-color: #2CC211">&nbsp</td>
				<td rowspan="2" style="background-color: #C2114F">&nbsp</td>
				<td style="background-color: #2CC211">&nbsp</td>
				<td rowspan="2">
					<table border="1" style="width:100%">
						<tr>
							<td style="background-color: #8F11C2">&nbsp</td>
							<td style="background-color: #8F11C2">&nbsp</td>
						</tr>
						<tr>
							<td colspan="2" style="background-color: #8F11C2">&nbsp</td>
						</tr>
						<tr>
							<td style="background-color: #8F11C2">&nbsp</td>
							<td style="background-color: #8F11C2">&nbsp</td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td style="background-color: #2CC211">&nbsp</td>
				<td style="background-color: #2CC211">&nbsp</td>
			</tr>
			<tr>
				<td colspan="4" style="background-color: #FF1794 ">&nbsp</td>
			</tr>
			<tr>
				<td rowspan="2" style="background-color: #C2114F">&nbsp</td>
				<td style="background-color: #2CC211">&nbsp</td>
				<td style="background-color: #C2114F">&nbsp</td>
				<td rowspan="3">
					<table border="1" style="width:100%">
						<tr>
							<td rowspan="3" style="background-color: #1CCBD9">&nbsp</td>
							<td style="background-color: #1CCBD9">&nbsp</td>
						</tr>
						<tr>
							<td style="background-color: #1CCBD9">&nbsp</td>
						</tr>
						<tr>
							<td>
								<table border="1" style="width:100%">
									<tr>
										<td style="background-color: #15730F">&nbsp</td>
										<td>
											<table border="1" style="width:100%">
												<tr>
													<td style="background-color: #EBD10E">&nbsp</td>
													<td style="background-color: #EBD10E">&nbsp</td>
												</tr>
												<tr>
													<td style="background-color: #EBD10E">&nbsp</td>
													<td style="background-color: #EBD10E">&nbsp</td>
												</tr>
											</table>
										</td>
									</tr>
									<tr>
										<td style="background-color: #15730F">&nbsp</td>
										<td style="background-color: #15730F">&nbsp</td>
									</tr>
								</table>
							</td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td rowspan="2" style="background-color: #C2114F">&nbsp</td>
				<td style="background-color: #2CC211">&nbsp</td>
			</tr>
			<tr>
				<td style="background-color: #2CC211">&nbsp</td>
				<td style="background-color: #C2114F">&nbsp</td>
			</tr>
		</table>
	</body>
</html>
