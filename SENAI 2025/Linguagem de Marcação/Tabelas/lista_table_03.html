<! DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Tabelas HTML</title>
	</head>
	<body>
		<header style="background-color: #C3CEDE">	
		<br>
		<h1 style="text-align: center">Tabela</h1>
		<hr>
		</header>
			<main>
				<article>
					<table border="1" style="width:100%">
						<tr> <!--- linha da tabela -->
							<th style="background-color: #A32AD1; color: #ffffff">Cabeçalho 1</th>
							<th style="background-color: #A32AD1; color: #ffffff">Cabeçalho 2</th>
							<th style="background-color: #A32AD1; color: #ffffff">Cabeçalho 3</th>
						</tr>
						<tr>
							<td style="background-color: #15031C; color: #ffffff">Conteúdo 1</td> 
							<td>
								<table border="1" style="width:100%">
									<tr>
										<th style="background-color: #F0E216; text-align: left">1</th>
										<th style="background-color: #D41117; text-align: right; color: #ffffff">2</th>
									</tr>
									<tr>
										<th style="background-color: #0E21CC; text-align: right; color: #ffffff">3</th>
										<th style="background-color: #0EE622; text-align: left">4</th>
									</tr>
								</table>
							</td>
							<td style="background-image: url('https://previews.123rf.com/images/intara1/intara11808/intara1180800017/106927192-abstract-sunburst-pattern-gradient-red-orange-and-yellow-ray-colors-vector-illustration-eps10.jpg');"> Conteúdo 3 </td>
						</tr>
						<tr>
							<td style="background-color: #15031C; color: #ffffff">Conteúdo 4</td>
							<td style="background-image: url('https://img.elo7.com.br/product/zoom/17DDCFB/papel-de-parede-zig-zag-2-tons-de-cinza-papel-de-parede-chevron.jpg');"> Conteúdo 5 </td>
							<td>
								<table border="1" style="width:100%">
									<tr>
										<th style="background-color: #CF990A">5</th>
										<th style="background-color: #C215C2; text-align: left">6</th>
									</tr>
									<tr>
										<th style="background-color: #C21552; text-align: right">7</th>
										<th style="background-color: #CF990A">8</th>
									</tr>
								</table>
							</td>
						</tr>
					</table>
				</article>
			</main>
	</body>
</html>
