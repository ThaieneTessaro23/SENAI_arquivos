<!DOCTYPE html>
<html lang="pt-br">
	<head>
     	<title>Formulário Reserva em Restaurante </title>
     	<meta charset="UTF-8">
	</head>
	<body>
		<form action="#" method="POST">
			<label> Nome </label>
			<br>
			<input type="text" id="nome" name="nome" required placeholder="Nome...">
			<br><br>
			
			<label> Sobrenome </label>
			<br>
			<input type="text" id="sobrenome" name="sobrenome" required placeholder="Sobrenome...">
			<br><br>
			
			<label> E-mail </label>
			<br>
			<input type="email" id="email" name="email" required placeholder="nome@gmail.com">
			<br><br>
			
			<label> Telefone </label>
			<br>
			<input type="tel" id="telefone" name="telefone" required>
			<br><br>
			
			<label> Data da Reserva: </label>
			<br>
			<input type="date" id="data" name="data" required>
			<br><br>
			
			<label> Horário da Reserva: </label>
			<br>
			<input type="time" id="horario" name="horario" required>
			<br><br>
			
			<label> Preferências Alimentares: </label>
			<br>
			<input type="checkbox" id="vege" name="vege"> Vegetariano <br>
			<input type="checkbox" id="vega" name="vega"> Vegano <br>
			<input type="checkbox" id="oni" name="oni"> Onívoro <br>
			<input type="checkbox" id="ceto" name="ceto"> Cetogênico <br>
			<input type="checkbox" id="carne" name="carne"> Carnívoro <br>
			<input type="checkbox" id="glu" name="glu"> Sem glúten <br>
			
			<label> Restrições Alimentares: </label>
			<br>
			<input type="checkbox" id="lac" name="lac"> Intolerância à lactose <br>
			<input type="checkbox" id="glu" name="glu"> Intolerância ao glúten <br>
			<input type="checkbox" id="ovo" name="ovo"> Alergia a ovo <br>
			<input type="checkbox" id="amen" name="amen"> Alergia a amendoim <br>
			<input type="checkbox" id="outro" name="outro"> Outro... <br>
			
			<label> Comentários Adicionais </label>
			<textarea type="text" id="coment" name="coment" placeholder="Insira seu texto...">
			<br><br>
			
			<label> Tipo de Evento </label>
			<select id="event" name="event">
				<option>Selecione...</option>
				<option>Palestra</option>
				<option>Workshops</option>
			</select>
			<br><br>
		</form>
	</body>
</html>
