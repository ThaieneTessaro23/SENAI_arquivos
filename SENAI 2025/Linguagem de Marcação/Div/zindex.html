<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<title>Z-index</title>
		<meta charset="UTF-8">
		<style>
			.fora-container{
				position: relative;
				width: 500px;
				height: 500px;
				background-color: #3f3f3f;
				z-index: -1;
			}
			.container{
				position: absolute;
				width: 300px;
				height: 300px;
				background-color: lightgray;
			}
			.box1{
				position: absolute;
				top: 20px;
				left: 20px;
				width: 150px;
				height: 100px;
				background-color: lightblue;
				z-index: 1;
			}
			.box2{
				position: absolute;
				top: 40px;
				left: 40px;
				width: 150px;
				height: 100px;
				background-color: lightcoral;
				z-index: 2;
			}
			.box3{
				position: absolute;
				top: 60px;
				left: 60px;
				width: 150px;
				height: 100px;
				background-color: lightgreen;
				z-index: 3;
			}
		</style>
	</head>
	<body>
		<div class="fora-container">
			<div class="container">
				<div class="box1">Box 1 (Z-index: 1)</div>
				<div class="box2">Box 2 (Z-index: 2)</div>
				<div class="box3">Box 3 (Z-index: 3)</div>
			</div>
		</div>
	</body>
</html>
