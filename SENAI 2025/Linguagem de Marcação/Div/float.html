<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<title>Float</title>
		<meta charset="UTF-8">
		<style>
			.left{
				float: left;
			}
			.right{
				float: right;
			}
			.clear{
				clear: both;
			}
		</style>
	</head>
	<body>
		<h1>Exemplos de floats:</h1>
			<div>
				<h2>float: left;</h2>
				<p class="left">Um texto</p>
				<img class="left" src="https://i.pinimg.com/1200x/27/1a/43/271a43830349050a69ca44e142810824.jpg" alt="Imagem na Esquerda" width="30%">
			</div>
			
			<hr class="clear">
			
			<div>
				<h2>float: right;</h2>
				<p class="right">Um texto</p>
				<img class="right" src="https://i.pinimg.com/1200x/27/1a/43/271a43830349050a69ca44e142810824.jpg" alt="Imagem na Esquerda" width="30%">
			</div>
	</body>
</html>
