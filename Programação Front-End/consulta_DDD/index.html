<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de DDD</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 20px;
            background-color: #198754;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #999;
        }

        #mensagem {
            text-align: center;
            margin: 15px 0;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #198754;
            color: white;
        }

        #resultado {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Consulta de DDD</h1>

        <form id="formulario">

            <input
                type="text"
                id="ddd"
                placeholder="Digite o DDD"
                maxlength="2"
            >

            <button type="submit" id="botao">
                Buscar
            </button>

        </form>

        <div id="mensagem"></div>

        <div id="resultado">

            <table>

                <thead>
                    <tr>
                        <th>Estado</th>
                        <th>Cidade</th>
                    </tr>
                </thead>

                <tbody id="tabelaCidades"></tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
