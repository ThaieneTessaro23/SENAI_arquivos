<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Exemplo 13 - DOM - JS</title>
        <meta charset="UTF-8">
        <style>
            input{
                display: block;
                padding: 5px;
                width: 250px;
            }
            .erro{
                color: red;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <h2>Cadastro de Usuário</h2>

        <form id="formCadastro">
            <label>Nome: </label>
            <input type="text" id="nome">
            <span id="erroNome" class="erro"></span>
            <br><br>

            <label>CPF: </label>
            <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00"> <!--maxlength -> máximo de caracteres-->
            <span id="erroCpf" class="erro"></span>
            <br><br>

            <label>Telefone: </label>
            <input type="text" id="telefone" maxlength="15" placeholder="(00) 00000-0000"> 
            <span id="erroTelefone" class="erro"></span>
            <br><br>

            <button type="submit">Enviar!</button>
        </form>

        <script src="exemplo_js_13.js"></script>
    </body>
</html>
