<!DOCTYPE html>
<html>
	<head>
		<title>Exemplo 10 - DOM - JS</title>
		<meta charset="UTF-8">
	</head>
	<body>
		<p>Essa é uma página HTML com DOM</p>
		<button onClick="mostrarMensagem()">Clique em mim!</button> <!-- onClick = ao clicar -->
		<button onmouseover="mostrarMensagem()">Passe o mouse aqui!</button>
	</body>
	<script>
		function mostrarMensagem(){
			alert("Eu sou uma mensagem de alerta!");
		}
	</script>
</html>
