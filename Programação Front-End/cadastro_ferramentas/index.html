<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro de Ferramentas</title>

        <!-- Bootstrap CSS via CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Seu arquivo CSS -->
        <link rel="stylesheet" href="style.css">

        <!-- SweetAlert2 via CDN -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <!-- Seu arquivo JavaScript -->
        <script src="script.js" defer></script>

    </head>

    <body>
        <main class="container py-5">

            <!-- CABEÇALHO -->
            <header class="cabecalho text-center mb-4">
                <h1>Cadastro de Ferramentas 🔨✨</h1>
            </header>

            <!-- FORMULÁRIO -->
            <section class="card formulario mb-4">
                <div class="card-body">

                    <h2 class="titulo-secao">Nova ferramenta</h2>

                    <form id="formFerramenta" novalidate>

                        <div class="row g-3">

                            <!-- Ferramenta -->
                            <div class="col-md-5">
                                <label for="ferramenta" class="form-label">Ferramenta</label>
                                <input type="text" id="ferramenta" class="form-control" placeholder="Digite o nome da ferramenta">
                                <small id="erroFerramenta" class="mensagem-erro"></small>
                            </div>

                            <!-- Setor -->
                            <div class="col-md-4">
                                <label for="setor" class="form-label">Setor</label>
                                <select id="setor" class="form-select">
                                    <option value="" selected disabled>Selecione o setor</option>
                                    <option value="Produção">Produção</option>
                                    <option value="Manutenção">Manutenção</option>
                                    <option value="Almoxarifado">Almoxarifado</option>
                                    <option value="Qualidade">Qualidade</option>
                                    <option value="Expedição">Expedição</option>
                                    <option value="Administrativo">Administrativo</option>
                                </select>
                                <small id="erroSetor" class="mensagem-erro"></small>
                            </div>

                            <!-- Quantidade -->
                            <div class="col-md-3">
                                <label for="quantidade" class="form-label">Quantidade</label>
                                <input type="number" id="quantidade" class="form-control" placeholder="Ex.: 10" min="1">
                                <small id="erroQuantidade" class="mensagem-erro"></small>
                            </div>

                        </div>

                        <!-- BOTÕES -->
                        <div class="botoes mt-4">
                            <button type="submit" id="btnSalvar" class="btn btn-primary">
                                Cadastrar ferramenta
                            </button>

                            <button type="button" id="btnCancelar" class="btn btn-secondary d-none">
                                Cancelar edição
                            </button>
                        </div>

                    </form>

                </div>
            </section>

            <!-- TABELA DE FERRAMENTAS -->
            <section class="card lista-ferramentas">

                <div class="card-body">

                    <div class="cabecalho-tabela">

                        <div>
                            <h2 class="titulo-secao">Ferramentas cadastradas</h2>
                            <p class="texto-ajuda">
                                Consulte, edite ou remova as ferramentas cadastradas.
                            </p>
                        </div>

                        <button type="button" id="btnLimparTudo" class="btn btn-danger">
                            Limpar todos
                        </button>

                    </div>

                    <!-- TABELA -->
                    <div class="table-responsive">

                        <table class="table tabela" id="tabelaFerramentas">

                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Ferramenta</th>
                                    <th>Setor</th>
                                    <th>Quantidade</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>

                            <tbody id="listaFerramentas">
                                <!-- As ferramentas serão adicionadas aqui pelo JavaScript -->
                            </tbody>

                        </table>

                    </div>

                    <!-- MENSAGEM QUANDO NÃO HÁ CADASTROS -->
                    <div id="mensagemVazia" class="mensagem-vazia">
                        Nenhuma ferramenta cadastrada.
                    </div>

                </div>

            </section>

        </main>

    <!-- Bootstrap JavaScript via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
