<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Página Responsiva com Menu</title>
        <meta name="viewport" content="width=device-width, inicial-scale=1.0">
        <meta charset="UTF-8">
        <style>
            *{
                margin: 0px;
                padding: 0px;
            }
            html, body{
                height: 100%;
                background-color: #f4f4f4;
                color: #333;
                font-family: Arial, sans-serif;
            }
            body{
                display: flex;
                flex-direction: column;
            }
            header{
                background-color: #0077cc;
                color: #fff;
                padding: 1rem;
                text-align: center;
            }
            nav{
                background-color: #005fa3;
            }
            .menu{
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
            }
            .menu a{
                color: #fff;
                padding: 1rem;
                text-decoration: none;
                text-align: center;
            }
            .menu a:hover{
                background-color: #004a80;
            }

            /*Botão sanduíche*/
            .menu-toggle{
                display: none;
                background-color: #005fa3;
                color: #fff;
                padding: 1rem;
                cursor: pointer;
                text-align: right;
                font-size: 1.5rem;
                z-index: 1000;
            }
            .menu-toggle:focus{
                outline: none;
            }
            .container{
                flex: 1;
                display: flex;
                flex-wrap: wrap;
                padding: 1rem;
            }
            main{
                flex: 3;
                padding: 1rem;
                background-color: white;
                margin-bottom: 1rem;
            }
            aside{
                flex: 1;
                padding: 1rem;
                background-color: #e0e0e0;
                margin-bottom: 1rem;
            }
            footer{
                background-color: #333;
                color: #fff;
                text-align: center;
                padding: 1rem;
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
            }
            @media (max-width: 768px){
                .menu{
                    display: none;
                    flex-direction: column;
                    text-align: center;
                    background-color: #005fa3;
                    position: fixed;
                    top: 8rem;
                    left: 0;
                    width: 100%;
                    z-index: 999;
                }
                .menu.show{
                    display: flex;
                }
                .menu-toggle{
                    display: block;
                }
                .container{
                    flex-direction: column;
                    padding-bottom: 4rem;
                }
                aside{
                    order: -1;
                }
            }

            /*Estilo para tablet e computador*/
            @media (min-width: 769px){
                .menu{
                    display: flex !important;
                }
                .menu-toggle{
                    display: none;
                }
                .container{
                    padding-bottom: 4rem;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Minha página Responsiva</h1>
        </header>

        <!-- Botão sanduíche fixo -->
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>

        <nav>
            <div class="menu" id="menu">
                <a href="#">Início</a>
                <a href="#">Serviços</a>
                <a href="#">Sobre</a>
                <a href="#">Contato</a>
            </div>
        </nav>

        <div class="container">
            <main>
                <h2>Bem-vindo!</h2>
                <p>Esta é uma página com menu sanduíche</p>
                <p>Ideal para navegação em dispositivos móveis</p>
            </main>

            <aside>
                <h3>Notícias</h3>
                <p>Últimas atualizações e artigos recentes!</p>
            </aside>
        </div>

        <footer>
            <p>&copy; 2026 SENAI. Todos os direitos reservados! </p>
        </footer>
    </body>
    <script>
        function toggleMenu(){
            const menu = document.getElementById('menu');
            menu.classList.toggle('show');
        }
    </script>
</html>
