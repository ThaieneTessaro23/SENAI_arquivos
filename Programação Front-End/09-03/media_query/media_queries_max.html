<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Media Queries - Max</title>
        <style>
            *{
                margin: 0px;
                padding: 0px;
                font-family: Verdana;
            }
            html, body{
                height: 100%;
            }
            body{
                display: flex;
                flex-direction: column;
            }
            header{
                background-color: #dd213c;
                padding: 15px;
                text-align: center;
                color: #fff;
            }
            .content{
                flex: 1;
                display: flex;
                flex-wrap: wrap;
                overflow: auto;
            }
            .menu{
                width: 20%;
                text-align: center;
            }
            .menu a{
                background-color: #eb798a;
                padding: 8px;
                margin-top: 7px;
                display: block;
                width: 100%;
                color: #000;
            }
            .main{
                width: 55%;
                padding: 0 20px;
            }
            .right{
                background-color: orange;
                width: 20%;
                padding: 15px;
                margin-top: 7px;
                text-align: center;
            }
            footer{
                background-color: #dd213c;
                text-align: center;
                padding: 10px;
                color: #fff;
            }
            @media only screen and (max-width: 620px){
                .menu, .main, .right{
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Logo do site</h1>
        </header>

        <div class="content">
            <div class="menu">
                <a href="#">Menu 1</a>
                <a href="#">Menu 2</a>
                <a href="#">Menu 3</a>
                <a href="#">Menu 4</a>
            </div>
        

            <div class="main">
                <h2>Conteúdo</h2>
                <p>Texto do site</p>
            </div>

            <div class="right">
                <h2>Anúncios</h2>
                <p>Aqui vem a propaganda do tigrinho</p>
                <p>Solta a carta</p>
            </div>
        </div>

        <footer>© copyright SENAI 2026.</footer>
    </body>
</html>
