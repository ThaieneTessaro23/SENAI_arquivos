<!DOCTYPE html>
<html lang="pt=br">
    <head>
        <meta charset="UTF-8">
        <title>Media Queries - Min</title>
        <style>
            body{
                background-color: cornsilk;
            }
            @media screen and (min-width: 480px){
                body{
                    background-color: coral;
                }
            }
        </style>
    </head>
    <body>
        <h1>Mude o tamanho da janela!</h1>
        <p>A propriedade media query apenas irá alterar o CSS quando o tamanho da janela for maior ou igual (>=) a 480px.</p>
    </body>
</html>
