<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Card Produto</title>

    <style>

    .card{
        display: flex;
        flex-direction: column;
        width: 300px;
        border-radius:10px;
        padding:15px;
        background-color:white;
    }

    .card img{
        width:100%;
        border-radius:10px;
    }

    @media (min-width:1024px){

        .card{
            flex-direction: row;
            margin-right:20px;
        }

        .card img{
            width:50%;
        }

        .card info{
            width:50%;
        }

    }
    </style>
</head>

    <body>
        <div class="card">
        <img src="produto.jpg" alt="Produto">
            <div class="info">
                <h2>Cosmético</h2>
                <p>Cheiroso e cremoso. Kit completo</p>
                <p>R$ 400,00</p>
            </div>
        </div>
    </body>
</html>
