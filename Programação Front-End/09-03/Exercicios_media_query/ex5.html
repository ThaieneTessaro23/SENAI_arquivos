<!DOCTYPE html>
<html lang="pt=br">
    <head>
        <title>Página Responsiva com Menu</title>
        <meta name="viewport" content="width=device-width, inicial-scale=1.0">
        <meta charset="UTF-8">
        <style>
            .promocao{
                padding: 40px;
                text-align: center;
                background-color: #e5d3eb;
                font-size: 24px;
                font-weight: bold;
            }

            @media (min-width: 500px) and (max-width: 800px){
                
                .promocao{
                    background-color: black;
                    color: white;
                    border: 5px solid #39ff14;
                }

            }

            </style>
        </head>
    <body>
        <div class="promocao">
            <h1>Banner Promocional</h1>
            <p>Pague 3 e leve 2</p>
        </div>

    </body>
</html>
