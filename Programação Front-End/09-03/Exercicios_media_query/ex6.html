<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Media Queries</title>

    <style>

    @media (orientation: portrait){
        body{
            background-color: green;
        }
    }

    @media (orientation: landscape){
        body{
            background-color: red;
        }
    }

    </style>
</head>
<body>

    <h1>Teste de orientação</h1>
    <p>Gire o celular e veja a mágica acontecer</p>

</body>
</html>
