<!DOCTYPE html>
<html lang="pt=br">
    <head>
        <meta charset="UTF-8">
        <title>Media Queries</title>
        <style>
            @media screen and (min-width: 1024px){
                p{
                    font-size: 24px;
                }
            }
            @media screen and (max-width: 1023px) and (min-width: 767px){
                p{
                    font-size: 18px;
                }
            }
            @media screen and (max-width: 768px){
                p{
                    font-size: 14px;
                }
            }


        </style>
    </head>
    <body>
        <h1>Tipografia</h1>
        <p>Testando a tipografia e tamanho de fontes</p>
    </body>
</html>
