<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Exemplo 1 - Sweet Alert</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    </head>
    <body>
        <button onclick="mostrarAlerta()">Sweet Alert</button>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function mostrarAlerta(){
            Swal.fire({
                title: 'Sucesso!',
                text: 'Bem vindo!',
                icon: 'success'
            });
        }
    </script>
</html>
