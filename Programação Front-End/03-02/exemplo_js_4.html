<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 4 com JS</title>
	</head>
	<body>
		<p> Essa é uma página HTML + JS </p>
	</body>
	<script>
		//Função de data e hora 
		function mostrarDataHora(){
			let agora = new Date();
			let dataHora = agora.toLocaleString("pt-br");
			alert("Data e hora atual: "+ dataHora);
		}
		//Chama a Função
		mostrarDataHora();
		
		//Função Matemática
		//Gerar número aleatório entre 1 e 10
		function gerarNumeroAleatorio(){
			let numero = Math.floor(Math.random() * 10) + 1; //floor -> não gerar decimal/ random -> aleatório/ 10 vai de 0 a 9, para ir até 10, usa +1
			alert("Número aleatório: "+ numero);
		}
		gerarNumeroAleatorio();
		
		//Função de String = Texto
		function tratarTexto(texto){
			alert("Texto original: " + texto);
			alert("Letras Maiúsculas: " + texto.toUpperCase());
			alert("Letras Minúsculas: " + texto.toLowerCase());
			alert("Quantidade de caracteres: " + texto.length);
		}
		tratarTexto(prompt("Digite seu nome: "));
	</script>
</html>
