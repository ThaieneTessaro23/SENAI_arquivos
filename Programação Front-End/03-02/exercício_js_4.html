<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exercício 4 com JS</title>
	</head>
	<body>
		<p> Essa é uma página HTML + JS </p>
	</body>
	<script>
		let agora = new Date();
		alert("Dia: " + agora.getDate());
		alert("Mês: " + parseInt(agora.getMonth()+1)); //parseInt -> passa o mês para inteiro
		alert("Ano: " + agora.getFullYear());
		alert("Hora: " + agora.getHours());
		alert("Minuto: " + agora.getMinutes());
	</script>
</html>
