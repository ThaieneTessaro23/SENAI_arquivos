<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de EPIs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">
        <header class="text-center mb-4">
            <h1 class="mb-1">Cadastro de EPIs ⛑️✨</h1>
            <p class="text-secondary">Equipamentos de Proteção Individual no almoxarifado</p>
        </header>

        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h5 mb-3">+ Novo equipamento</h2>

                <form id="formulario">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nomeEpi" class="form-label">Nome do EPI</label>
                            <input type="text" class="form-control" id="nomeEpi" placeholder="Ex.: Capacete">
                        </div>

                        <div class="col-md-6">
                            <label for="tipoProtecao" class="form-label">Tipo de proteção</label>
                            <input type="text" class="form-control" id="tipoProtecao" placeholder="Ex.: Cabeça">
                        </div>

                        <div class="col-md-6">
                            <label for="quantidade" class="form-label">Quantidade disponível</label>
                            <input type="number" class="form-control" id="quantidade" min="1" placeholder="Ex.: 50">
                        </div>

                        <div class="col-md-6">
                            <label for="numeroCA" class="form-label">Número do Certificado de Aprovação</label>
                            <input type="text" class="form-control" id="numeroCA" placeholder="Ex.: 12345">
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-2 flex-wrap">
                        <button type="submit" class="btn btn-primary">Cadastrar EPI</button>
                        <button type="button" id="btnApagarTodos" class="btn btn-danger">Apagar todos</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="card shadow-sm">
            <div class="card-body">
                <h2 class="h5 mb-3">Equipamentos cadastrados</h2>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Nome do EPI</th>
                                <th>Tipo de proteção</th>
                                <th>Quantidade</th>
                                <th>Número do CA</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela"></tbody>
                    </table>
                </div>

                <p id="semRegistros" class="text-center text-secondary mb-0">Nenhum equipamento cadastrado.</p>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>

</body>
</html>
